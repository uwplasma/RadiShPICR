[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "RadiShPICR"
version = "0.1.0"
description = "Spherically symmetric electrostatic particle-in-cell simulations with numerical relativity"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Christopher Woolford" },
]
dependencies = [
    "jax",
    "matplotlib",
    "numpy",
    "tqdm",
]

[project.optional-dependencies]
test = [
    "pytest",
]

[tool.setuptools.packages.find]
include = ["RadiShPICR*"]
